name: 🛡️ DevSecOps Automated Security Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ----------------------------------------------------
  # STAGE 1: Secret Scanning (Gitleaks)
  # ----------------------------------------------------
  secret-scan:
    name: 🔑 Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ----------------------------------------------------
  # STAGE 2: Static Application Security Testing (SAST)
  # ----------------------------------------------------
  sast-scan:
    name: 🔍 SAST (Bandit & Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install Bandit & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit Security Analysis
        run: |
          bandit -r . -x ./venv,./.venv -ll

  # ----------------------------------------------------
  # STAGE 3: Dependency Vulnerability Audit
  # ----------------------------------------------------
  dependency-audit:
    name: 📦 Dependency Vulnerability Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run Dependency Audit
        run: |
          pip-audit -r requirement.txt

  # ----------------------------------------------------
  # STAGE 4: Container Security Scanning (Trivy)
  # ----------------------------------------------------
  container-scan:
    name: 🐳 Container Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [sast-scan, dependency-audit]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Build Flask Application Image
        run: |
          docker build -t devsecops-flask-app:latest .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devsecops-flask-app:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ----------------------------------------------------
  # STAGE 5: Infrastructure as Code (IaC) Audit
  # ----------------------------------------------------
  iac-security:
    name: 🏗️ IaC Security Audit (Checkov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Run Checkov IaC Scanner
        uses: bridgecrewio/checkov-action@master
        with:
          framework: dockerfile,docker_compose,terraform
          output_format: cli
          soft_fail: true
