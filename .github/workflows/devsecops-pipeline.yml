name: DevSecOps Automated Security Pipeline

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  # ----------------------------------------------------
  # STAGE 1: Secret Scanning (Gitleaks)
  # ----------------------------------------------------
  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          report-format: sarif
          report-path: gitleaks-report.sarif

      - name: Upload Gitleaks Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.sarif

  # ----------------------------------------------------
  # STAGE 2: Static Application Security Testing (SAST)
  # ----------------------------------------------------
  sast-scan:
    name: SAST (Bandit & Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit Security Analysis
        run: |
          bandit -r . -x ./venv,./.venv -f json -o bandit-report.json || true
        # Note: using '|| true' so workflow continues, but report is saved for review

      - name: Upload Bandit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  # ----------------------------------------------------
  # STAGE 3: Dependency Vulnerability Audit
  # ----------------------------------------------------
  dependency-audit:
    name: Dependency Vulnerability Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Check for requirements.txt
        id: check-req
        run: echo "exists=${{ hashFiles('requirements.txt') != '' }}" >> $GITHUB_OUTPUT

      - name: Run Dependency Audit
        if: steps.check-req.outputs.exists == 'true'
        run: pip-audit -r requirements.txt --desc --format=json -o pip-audit-report.json || exit 1

      - name: Upload pip-audit Report
        if: always() && steps.check-req.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json

  # ----------------------------------------------------
  # STAGE 4: Container Security Scanning (Trivy)
  # ----------------------------------------------------
  container-scan:
    name: Container Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [sast-scan, dependency-audit]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Flask Application Image
        run: |
          docker build -t devsecops-flask-app:latest .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: 'devsecops-flask-app:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: false
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          output: 'trivy-report.txt'

      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt

  # ----------------------------------------------------
  # STAGE 5: Infrastructure as Code (IaC) Audit
  # ----------------------------------------------------
  iac-security:
    name: IaC Security Audit (Checkov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Checkov IaC Scanner
        uses: bridgecrewio/checkov-action@3.2.0
        with:
          framework: dockerfile,docker_compose,terraform
          output_format: cli
          soft_fail: false
          download_external_modules: true

      - name: Upload Checkov Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-report
          path: results.xml
